name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build
        # Set the repository variable VITE_STOREFRONT_API to the storefront API's
        # public URL. Left unset, the site builds against the local catalogue in
        # src/data/products.js and keeps the WhatsApp handoff.
        env:
          VITE_STOREFRONT_API: ${{ vars.VITE_STOREFRONT_API }}
        run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/

      - name: Rewrite absolute public-asset paths for the sub-path deploy
        run: node scripts/rewrite-base.mjs ${{ steps.pages.outputs.base_path }}/

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
